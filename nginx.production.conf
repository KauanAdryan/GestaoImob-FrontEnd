server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # /clientes is both a frontend route and an API endpoint. Browser page
    # navigations request HTML; API calls request JSON or */*.
    location = /clientes {
        error_page 418 = /index.html;
        if ($http_accept ~* "text/html") { return 418; }

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(actuator|api|auth|propostas|ruas|estados|enderecos|leiloes|cidades|imoveis|usuarios|ocorrencias|etapas|historico-etapas|despesas|negociacoes)(/|$) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
